services:
  - type: web
    name: lacasaca-backend-lab
    runtime: node
    plan: free
    branch: laboratorio
    buildCommand: npm ci && npm run build --workspace backend
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_ENV
        value: lab
      - key: DATABASE_URL
        sync: false

  - type: web
    name: lacasaca-frontend-lab
    runtime: static
    plan: free
    branch: laboratorio
    buildCommand: npm ci && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://lacasaca-backend-lab.onrender.com/api